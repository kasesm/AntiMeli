name: Run Telegram Config Scraper

on:
  schedule:
    # اجرای خودکار رأس هر ساعت رند (دقیقه 0 هر ساعت)
    - cron: '0 * * * *'
  workflow_dispatch:
    # فعال کردن دکمه اجرای دستی در تب Actions گیت‌هاب برای تست آنی

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon pycryptodome

      - name: Run Scraper Script
        env:
          # متصل کردن سکرت‌های جدید شما به محیط اجرای پایتون
          TELEGRAM_API_ID: ${{ secrets.TG_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TG_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TG_SESSION_STRING }}
        run: python scraper.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add configs.txt
          # کامیت کردن تغییرات فقط در صورتی که دیتای جدیدی اضافه شده باشد تا پایپ‌لاین ارور ندهد
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update collected configs [Automated]" && git push)
